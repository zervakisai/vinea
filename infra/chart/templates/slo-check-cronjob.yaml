{{- if .Values.slo.enabled }}
# Evaluate the objectives once a day and record any breach.
#
# 06:05 local, five minutes after the availability deadline: earlier and it would
# fail every tenant whose advisory is still being written; later and nobody sees
# the breach on the morning it happened.
#
# Three outputs, in decreasing order of durability: a row in `slo_breaches`, a
# non-zero exit (so the CronJob's own failure count is a signal), and a POST to
# VINEA_ALERT_WEBHOOK_URL if the Secret carries one.
#
# The webhook URL lives in the Secret, not in values.yaml, and is picked up through
# the `envFrom: secretRef` that `vinea.env` already applies -- a Slack or Discord
# webhook URL is a bearer credential wearing a URL's clothes, and `helm get values`
# is readable by anyone who can read the release. Unset is a supported state: the
# breach is still recorded and the job still fails.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vinea.fullname" . }}-slo-check
  labels:
    {{- include "vinea.labels" . | nindent 4 }}
    app.kubernetes.io/component: slo-check
spec:
  schedule: {{ .Values.slo.schedule | quote }}
  timeZone: {{ .Values.worker.timeZone | quote }}
  concurrencyPolicy: Forbid
  # Kept deliberately: a run that failed is the record that the objectives were
  # breached that morning, and `successfulJobsHistoryLimit: 1` would throw away
  # the pattern that matters -- three consecutive red mornings.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      # No retries. A breach is not a transient failure, and retrying it three
      # times writes three rows for one morning.
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "vinea.labels" . | nindent 12 }}
            app.kubernetes.io/component: slo-check
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1001
          containers:
            - name: slo-check
              image: {{ include "vinea.appImage" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- include "vinea.securityContext" . | nindent 16 }}
              command: ["python", "-m", "vinea.slo", "check"]
              {{- include "vinea.env" . | nindent 14 }}
              resources:
                {{- toYaml .Values.slo.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
