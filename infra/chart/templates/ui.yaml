{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vinea.fullname" . }}-ui
  labels:
    {{- include "vinea.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vinea.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "vinea.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: ui
          image: {{ include "vinea.uiImage" . }}
          imagePullPolicy: {{ .Values.uiImage.pullPolicy }}
          securityContext:
            {{- include "vinea.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          env:
            # ADR-005's rule, as configuration: the UI reaches the system through
            # the API and nothing else. This is the only address it is given, and
            # it is given no DATABASE_URL it could use even if a panel tried.
            - name: VINEA_API_URL
              value: "http://{{ include "vinea.fullname" . }}-api:{{ .Values.api.port }}"
          # Streamlit serves its own health endpoint; the app's /ready has no
          # meaning here because the UI holds no database connection at all.
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vinea.fullname" . }}-ui
  labels:
    {{- include "vinea.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  # Streamlit keeps per-session state in the server process, over a websocket.
  # Without affinity a second replica answers half the interactions from a pod
  # that has never seen the session, and the dashboard resets at random. Affinity
  # is the cheap fix; the honest one is that this component does not scale
  # horizontally, which is why replicaCount defaults to 1.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "vinea.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
{{- end }}
