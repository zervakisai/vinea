# Defaults are the *local kind* deployment: no ingress, one replica each, images
# loaded into the node rather than pulled. A paid cluster overrides this file; it
# does not need a different chart.

image:
  repository: vinea
  # Empty -> Chart.appVersion. Pinning the tag in values means a deploy is a
  # values change, which is what makes `helm rollback` meaningful.
  tag: ""
  pullPolicy: IfNotPresent

uiImage:
  repository: vinea-ui
  tag: ""
  pullPolicy: IfNotPresent

# The one Secret every workload reads, by reference. The chart NEVER templates a
# Secret: the house rule is that secrets do not live in tracked files, and in
# Kubernetes the manifests are tracked. Create it out of band, from a SealedSecret
# (see infra/sealed-secrets/README.md) or `kubectl create secret`.
secret:
  name: vinea-secrets

# Non-secret configuration. Anything here is safe to read in a `helm get values`.
config:
  model: "anthropic:claude-sonnet-4-5"
  promptLabel: "production"
  logLevel: "info"

api:
  replicaCount: 2          # >1 so a rolling deploy actually overlaps versions
  port: 8000
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

ui:
  enabled: true
  # One replica, and session affinity on the Service. Streamlit holds per-session
  # server state over a websocket; a second replica without affinity serves half
  # the interactions from a pod that has never heard of the session.
  replicaCount: 1
  port: 8501
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}

worker:
  enabled: true
  # 02:00 local, which is what DESIGN.md B1 designed the batch window around.
  schedule: "0 2 * * *"
  timeZone: "Europe/Athens"
  maxTasks: 100
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

migrate:
  # The pre-upgrade hook. Disable only if you run migrations out of band and know
  # why -- an expand migration that has not run before new pods start is the one
  # ordering this chart exists to guarantee.
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

# The LLM gateway (phase 14). Off by default, and that default is the phase's
# main claim: with `enabled: false` no VINEA_GATEWAY_URL is set, `resolve_model()`
# returns the plain model string, and the deployment is byte-for-byte the phase-13
# one. Turning it on is a values change.
gateway:
  enabled: false
  image: ghcr.io/berriai/litellm:main-v1.65.0-stable
  port: 4000
  # The alias the app asks for. Which upstream serves it lives in
  # files/litellm-config.yaml, i.e. in the gateway, not in this deployment.
  model: vinea-nightly
  # Point at a gateway somebody else operates. Set this and the chart renders no
  # Deployment, no Service and no ConfigMap -- it only tells the app where to go.
  externalUrl: ""
  # Holds the PROVIDER keys and LITELLM_MASTER_KEY. A different Secret from
  # `secret.name` on purpose: the app pods must be able to read their own Secret
  # and must NOT be able to read this one. Same-Secret-for-everything would hand
  # every workload the unbounded provider key and undo the reason for the gateway.
  secret:
    name: vinea-gateway-secrets
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}

# Retrieval (phase 15, ADR-008). Off by default, like the gateway, and for the
# same reason: with `enabled: false` no corpus is ingested, `retrieve_for` finds
# nothing, and the deployment behaves exactly as phase 14's did.
#
# The app image needs nothing special: retrieval is Postgres full-text search
# (ADR-011), so the ingest Job runs the same image as everything else.
#
# There is no `VINEA_RAG_ENABLED` env var, deliberately. Retrieval is on when the
# corpus is in the database and off when it is not; a second switch would let the
# two disagree, and the resulting question ("it says enabled, why no citations?")
# is worse than having one source of truth.
rag:
  enabled: false
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}

# Daily SLO evaluation (ADR-010). On by default: it needs nothing but the app
# image and the database, and an objective nobody evaluates is a wish.
slo:
  enabled: true
  # 06:05, five minutes after the availability deadline. Earlier fails every
  # tenant whose advisory is still being written.
  schedule: "5 6 * * *"
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

ingress:
  enabled: false
  className: ""
  host: vinea.local
  annotations: {}
