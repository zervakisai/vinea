name: CI

# The gate every push and PR passes: lint, a migrated Postgres, the full test
# suite (offline -- conftest sets ALLOW_MODEL_REQUESTS = False, so no live LLM
# ever runs in CI), and the prompt-drift check. Nothing here needs a model key.
# Added in phase 12, alongside the eval gate it exists to protect.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres for the DB-backed tests -- the same schema the app runs,
    # migrated by Alembic below. Port 5432 here (the local 55433 in
    # docker-compose is only a host-collision workaround, not needed in CI).
    services:
      postgres:
        # pgvector's image, not `postgres:16` (phase 15). Same server plus the
        # vector extension files; without them migration c73a51e8d4b2's
        # `CREATE EXTENSION vector` fails and every db-marked test errors. The
        # compose stack and the kind fixture moved with it -- one image, three
        # places, and the failure mode if they drift is a red CI that is right.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vinea
          POSTGRES_PASSWORD: vinea
          POSTGRES_DB: vinea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
      VINEA_TEST_DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Migrate the test database
        run: uv run alembic upgrade head

      - name: Tests (offline -- ALLOW_MODEL_REQUESTS = False, no live LLM)
        run: uv run pytest

      # The fail-open floor is only safe if it stays close to what production
      # serves (S7.3). This is a no-op without Langfuse credentials -- an
      # unpublished prompt is "not published", not drift -- and becomes a real
      # gate once LANGFUSE_* secrets are set on the repo.
      - name: Prompt drift check (bundled floor vs @production)
        run: uv run python -m vinea.prompts.drift
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

  # --------------------------------------------------------------------------
  # phase 13: the deploy path, exercised rather than diagrammed.
  #
  # `needs: test` is the ordering the phase argued was not negotiable:
  # test -> build -> migrate -> deploy -> smoke. The migrate step is not a step
  # here on purpose -- it is the chart's pre-upgrade hook, so the ordering lives
  # in the artifact rather than in this file, where a future edit could reorder it.
  # --------------------------------------------------------------------------
  # phase 17. Two scanners, because they see different things: pip-audit reads
  # uv.lock, an image scanner reads the OS layer that uv.lock knows nothing about.
  #
  # The gate is set at ZERO and can hold there, which is only true because phase
  # 17 fixed what it found rather than documenting it: gitpython (5 advisories,
  # via streamlit), pyasn1 (3, via google-auth), pytest (1, and the `<9` pin was
  # what held it back). A gate people route around is worse than no gate, so the
  # threshold is the one the repository actually meets.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The whole resolved set, dev included. A vulnerability in a test-only
      # package does not ship, but it does run on a developer's machine and in
      # this pipeline, which is a supply-chain surface of its own.
      - name: pip-audit (all dependencies)
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/all.txt
          uvx pip-audit -r /tmp/all.txt --progress-spinner off

      # And separately, what actually ships. Reported even though the job above
      # already covers it: when the two disagree, the difference is exactly the
      # "is this reachable in production?" question, and having it as its own
      # line of output means nobody has to reconstruct it under pressure.
      - name: pip-audit (what the app image installs)
        run: |
          uv export --no-dev --no-emit-project --no-hashes \
            --extra anthropic --extra gateway --extra rag \
            --format requirements-txt > /tmp/app.txt
          uvx pip-audit -r /tmp/app.txt --progress-spinner off

      - name: Build the app image
        run: docker build --target app -t vinea:scan .

      # Trivy reads the Debian layer under the venv -- the part `uv.lock` cannot
      # see. Failing on HIGH/CRITICAL only: a base image always carries a tail of
      # LOW findings with no fix available, and a gate that is red for reasons
      # nobody can act on is a gate that gets disabled.
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vinea:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deploy:
    name: Deploy to an ephemeral cluster
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kind
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      - name: Lint the chart
        run: helm lint infra/chart

      # The SAME script a human runs locally. A pipeline that reimplements the
      # deploy in YAML is a second implementation nobody executes on a laptop,
      # and it drifts until the day you need it.
      - name: End-to-end (build, load, migrate hook, rollout, smoke)
        run: ./infra/kind-e2e.sh

      # A failed deploy with no output is a failed deploy you debug by pushing
      # again. Everything needed to read the failure, collected once.
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl describe pods -l app.kubernetes.io/name=vinea || true
          kubectl logs -l app.kubernetes.io/component=migrate --tail=200 || true
          kubectl logs -l app.kubernetes.io/component=api --tail=100 || true
          helm status vinea || true

  # --------------------------------------------------------------------------
  # phase 13: the paid path is checked, never applied.
  #
  # `validate` and `fmt` are all CI can honestly do here. `plan` queries provider
  # APIs, so it needs real credentials and a billing account -- and a plan that
  # cannot run is not a gate, it is a step that always passes. Apply is a manual
  # operation with a budget attached; see infra/tofu/main.tf.
  # --------------------------------------------------------------------------
  infra:
    name: OpenTofu (validate, never apply)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/tofu

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: Format check
        run: tofu fmt -check -diff

      # -backend=false: no state, no credentials, no cloud contact. Enough to
      # resolve providers and type-check every resource and variable.
      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate
