[project]
name = "vinea"
version = "0.3.0"
description = "Daily irrigation and spray advisories for vineyards, from hourly weather"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    # Pinned to v1.x: Pydantic AI renamed result_type->output_type / result.data->result.output
    # before 1.0, so a v1 floor protects us from silent API drift mid-build.
    # phase 13: `pydantic-ai` is a META-package that installs EVERY provider SDK
    # plus Temporal -- measured in the image: temporalio 54 MB, botocore 30
    # (Bedrock), fastavro 14, tokenizers 11, hf_xet 9.5, none of which this system
    # can reach. `-slim` carries the framework; the provider SDKs are extras
    # below, because VINEA_MODEL selects exactly ONE at run time and an image has
    # no reason to carry the other four.
    "pydantic-ai-slim>=1.0,<2",
    "pydantic-graph>=1.0,<2",   # used as the 3-agent graph in phase 3 (#10); pulled by pydantic-ai too
    "python-dotenv>=1.0,<2",
    # phase 6 (persistence): the schema mirrors the contracts (SQLModel), migrations
    # are immutable versions (Alembic), psycopg3 is the sync driver the worker
    # and the API both use.
    "sqlmodel>=0.0.24",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # phase 7 (live data): the Open-Meteo adapter is built on httpx directly (not the
    # SDK) so the fail-open ladder later owns the deadline and the cache.
    "httpx>=0.28",
    # phase 9 (observability): logfire owns the global OTel provider that pydantic-graph
    # and pydantic-ai both emit spans into; the OTLP/HTTP exporter ships them to a
    # self-hosted Langfuse (ADR-004). send_to_logfire stays False.
    "logfire>=4.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # phase 10 (API): a thin FastAPI over the queue + store — it enqueues and reads, it
    # never runs a model. uvicorn runs it; httpx (above) drives the TestClient.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # phase 12 (evals): the eval gate wraps the deterministic oracles as pydantic-evals
    # Evaluators; same major line as pydantic-ai/graph.
    "pydantic-evals>=1.0,<2",
    # The SQLAlchemy column type for `corpus_chunks.embedding`, which is reserved
    # and unwritten (ADR-011). The schema still has to be describable by every
    # process that imports db/models.py, and this is ~50 KB of pure Python.
    "pgvector>=0.3",
]

# phase 13 (containerize): the UI stack is an EXTRA, not a core dependency, purely
# so the API/worker image does not have to carry it. Measured: pyarrow 119 MB +
# pandas 48 + numpy 24 + streamlit 29 = 220 MB, which alone blows the image budget
# for two processes that never import any of it (ADR-005 already forbids the UI
# from being imported by anything upstream, so this split follows a line that was
# already drawn).
#
# Extras are NOT installed by default and `tool.uv.default-extras` is not a real
# setting (uv warns and ignores it). Dependency *groups* ARE installed by default,
# so the `dev` group self-references `vinea[ui]` below -- which keeps a bare
# `uv sync` behaving exactly as it did, including phase 11's `uv run streamlit run`.
[project.optional-dependencies]
# One extra per provider in config.py's _KEY_ENV. The Dockerfile takes
# `--build-arg PROVIDER=` and installs exactly one (default: anthropic, matching
# config.MODEL). Local dev installs all five via the dev group, so nothing about
# the documented workflow changes.
anthropic = ["pydantic-ai-slim[anthropic]>=1.0,<2"]
openai    = ["pydantic-ai-slim[openai]>=1.0,<2"]
google    = ["pydantic-ai-slim[google]>=1.0,<2"]
groq      = ["pydantic-ai-slim[groq]>=1.0,<2"]
mistral   = ["pydantic-ai-slim[mistral]>=1.0,<2"]

ui = [
    # phase 11 (UI): a Streamlit dashboard that talks ONLY to the API (ADR-005). pandas
    # is for the charts' dataframes — a UI-layer dep; the core stays pandas-free.
    "streamlit>=1.40",
    "pandas>=2.0",
]

# phase 14 (gateway). Its own name rather than telling people to add `openai`,
# because the reason is not the provider: LiteLLM speaks the OpenAI wire format,
# so routing an *Anthropic* model through the gateway still needs the openai SDK
# in the image. An image built with PROVIDER=anthropic and no gateway extra fails
# at `import openai` the first night it is pointed at a gateway.
gateway = ["pydantic-ai-slim[openai]>=1.0,<2"]

[project.scripts]
# `uv run vinea` is the one command (resolve + install + run, no venv activation).
vinea = "vinea.cli:main"

[dependency-groups]
dev = [
    # phase 17: >=9.0.3 closes PYSEC-2026-1845. The <9 pin was there to keep the
    # suite on a known-good major while the project was being written; it has
    # outlived that and was pinning us to a known-vulnerable release.
    "pytest>=9.0.3,<10",
    "ruff>=0.8",
    # Self-reference to the ui extra so a bare `uv sync` still installs Streamlit:
    # dev groups ARE installed by default, extras are not.
    "vinea[ui,gateway,anthropic,openai,google,groq,mistral]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: touches Postgres; skipped when no DATABASE_URL/VINEA_TEST_DATABASE_URL is set",
    "langfuse: needs a running Langfuse; skipped unless LANGFUSE_HOST and keys are set",
]
filterwarnings = [
    # We pin pydantic-graph<2 and knowingly use the class-based Graph API (see graph.py docstring).
    "ignore:Importing .Graph. from .pydantic_graph. is deprecated",
]

[tool.ruff]
# 120, not 110: the hand-written core (phases 1-4) was written wider, and reflowing
# it to satisfy a linter adopted later would be churn on working code for no
# reader's benefit. New code stays comfortably inside it.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom IS a function call in an argument default
# -- Depends(...), Query(...), Header(...), Path(...). B008 flags that as a
# mutable-default footgun, but these are immutable markers FastAPI reads at
# startup, not mutable objects shared across calls.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; they're mechanical --autogenerate artifacts, and
# hand-reformatting them to satisfy a linter invites a transcription error in
# the one place you least want one. F/B still apply.
"migrations/versions/*" = ["E501", "UP007", "UP035", "I001"]

# The core (phases 1-4) was hand-written before ruff was adopted in phase 6.
# Reflowing it to satisfy a linter added afterwards is churn on working code no
# reader benefits from, so it keeps a narrow exemption. Everything written from
# phase 6 on is held to the full ruleset. graph.py's imports intentionally follow a
# warnings filter (the class-based Graph API), which ruff can't model; ingest's
# zip pairs a list with its own tail, so strict= would be wrong, not missing.
"src/vinea/agents.py" = ["E501"]
"src/vinea/cli.py" = ["E501"]
"src/vinea/features.py" = ["E501"]
"src/vinea/graph.py" = ["E402"]
"src/vinea/ingest.py" = ["B905"]
"src/vinea/reconcile.py" = ["E501"]
"tests/test_agents.py" = ["E501"]
"tests/test_robustness.py" = ["E501"]
